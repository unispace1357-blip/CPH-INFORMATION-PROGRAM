name: Public test web and Windows portable

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cph-public-test
  cancel-in-progress: false

jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run validate:hotel-copy
      - run: npm run test
      - run: npm run lint
      - run: npm run build:public-test
        env:
          CPH_TEST_BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-public-test

  deploy-pages:
    needs: web-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy explicit public test DEMO
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public Pages responses
        env:
          CPH_PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          const base = new URL(process.env.CPH_PAGES_URL)
          async function read(path) {
            const url = new URL(path, base)
            const response = await fetch(url, { signal: AbortSignal.timeout(20000) })
            assert.equal(response.status, 200, `Public request failed: ${url}`)
            return response.text()
          }
          const html = await read('')
          const assets = [...html.matchAll(/(?:src|href)="([^"]+\.(?:js|css|svg|ico))"/g)].map(match => match[1])
          assert.ok(assets.some(path => path.endsWith('.js')), 'Missing app module')
          for (const asset of assets) {
            assert.ok(new URL(asset, base).pathname.startsWith(base.pathname), 'Asset escaped the Pages subpath')
            await read(asset)
          }
          for (const route of ['staff', 'guest']) assert.ok((await read(route + '/')).includes('#/' + route))
          const adminHtml = await read('admin/')
          assert.ok(adminHtml.includes('admin/assets/'), 'Missing separate public DEMO admin bundle')
          const adminAssets = [...adminHtml.matchAll(/(?:src|href)="([^"]+\.(?:js|css))"/g)].map(match => match[1])
          assert.ok(adminAssets.some(path => path.endsWith('.js')), 'Missing demo admin JavaScript')
          for (const asset of adminAssets) {
            assert.ok(new URL(asset, base).pathname.startsWith(base.pathname + 'admin/'), 'Admin asset escaped its own subpath')
            await read(asset)
          }
          console.log(`::notice title=Public Pages HTTP verification::PASS ${base.href} and ${assets.length} local assets, staff/guest direct-entry pages all returned HTTP 200; browser interaction is tested separately.`)
          JS

  windows-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run desktop:package -- --directory-only
      - uses: actions/upload-artifact@v4
        with:
          name: CPH-Front-Desk-Public-Test-win-x64
          path: release/CPH-Front-Desk-Public-Test-win-x64/
          if-no-files-found: error
          retention-days: 30
