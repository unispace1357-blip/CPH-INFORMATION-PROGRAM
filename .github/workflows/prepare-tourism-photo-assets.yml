name: Prepare licensed tourism WebP photos (review branch only)

on:
  push:
    branches: [feature/tourism-photo-framing-six-spots-20261020]
    paths: [.github/workflows/prepare-tourism-photo-assets.yml]

permissions:
  contents: write

jobs:
  generate-local-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow requests
      - name: Fetch verified IFEZ originals and make portable WebP copies
        run: python scripts/prepare-tourism-photos.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cph-licensed-tourism-webp
          path: public/tourism-photos/*.webp
          if-no-files-found: ignore
          retention-days: 14
      - name: Commit optimized assets to the review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/tourism-photos/
          if git diff --cached --quiet; then
            echo "No new photo assets"
            exit 0
          fi
          git commit -m "chore: add small attributed IFEZ tourism photos"
          git push origin HEAD:feature/tourism-photo-framing-six-spots-20261020
